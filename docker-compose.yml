services:
  app:
    build:
      context: .
      args:
        VITE_DEPLOYMENT_PROFILE: private-sync
        VITE_PRIVATE_SYNC_ENABLED: 'true'
        VITE_API_BASE_PATH: /api
        VITE_FX_REFRESH_ENABLED: ${VITE_FX_REFRESH_ENABLED:-true}
        VITE_FX_REFRESH_RETRIES: ${VITE_FX_REFRESH_RETRIES:-2}
        VITE_FX_REFRESH_RETRY_DELAY_MS: ${VITE_FX_REFRESH_RETRY_DELAY_MS:-450}
    ports:
      - '127.0.0.1:3176:80'
    restart: unless-stopped
    mem_limit: 64m
    pids_limit: 128
    read_only: true
    tmpfs:
      - /var/cache/nginx:rw,noexec,nosuid,size=16m
      - /var/run:rw,noexec,nosuid,size=1m
      # The entrypoint writes the rendered config here at start.
      - /etc/nginx/conf.d:rw,noexec,nosuid,size=1m
      - /tmp:rw,noexec,nosuid,size=8m
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ['CMD-SHELL', 'wget -q -O /dev/null http://127.0.0.1/ || exit 1']
      interval: 30s
      timeout: 5s
      retries: 3

  api:
    build:
      context: ./backend
    restart: unless-stopped
    mem_limit: 128m
    pids_limit: 128
    environment:
      APP_STATE_FILE: /data/app-state.json
      VENDOR_OBSERVATIONS_FILE: /data/vendor-observations.json
      APP_STATE_MAX_BYTES: 5242880
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:3176,http://127.0.0.1:3176}
      SSB_ALLOWED_HOSTS: ${SSB_ALLOWED_HOSTS:-localhost,127.0.0.1}
      SSB_SYNC_TOKEN: ${SSB_SYNC_TOKEN:?Set SSB_SYNC_TOKEN before starting private sync}
    volumes:
      - app-state:/data
    healthcheck:
      test: ['CMD-SHELL', 'wget -q -O /dev/null http://127.0.0.1:3177/healthz || exit 1']
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  app-state:
