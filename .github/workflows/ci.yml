name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            backend/package-lock.json
      - uses: astral-sh/setup-uv@v7
      - run: npm ci
      - run: npm ci --prefix backend
      - run: npm run check
      # Shipped dependencies must have no known high/critical advisories.
      - run: npm audit --omit=dev --audit-level=high
      - run: npm audit --omit=dev --audit-level=high --prefix backend
