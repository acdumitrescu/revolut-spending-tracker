name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Weekly, so new advisories surface even when nothing is pushed.
    - cron: '17 5 * * 1'
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  TZ: UTC
  NODE_VERSION: 24

# Actions are pinned to full commit SHAs; Dependabot keeps them current.
jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: |
            package-lock.json
            backend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm run privacy:scan

  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: |
            package-lock.json
            backend/package-lock.json
      - run: npm ci
      - run: npm ci --prefix backend
      - run: npm run test:coverage
      - run: npm run test:git-privacy
      - name: Coverage summary
        if: always()
        run: |
          if [ -f coverage/coverage-summary.json ]; then
            node -e "const t=require('./coverage/coverage-summary.json').total;console.log('| metric | % |\n|---|---|');for(const k of ['statements','branches','functions','lines'])console.log('| '+k+' | '+t[k].pct+' |')" >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: coverage-summary
          path: coverage/coverage-summary.json
          if-no-files-found: ignore
          retention-days: 14

  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: |
            package-lock.json
            backend/package-lock.json
      - run: npm ci
      # Builds the native SQLCipher module for this runner.
      - run: npm ci --prefix backend
      - run: npm run test:contract

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: |
            package-lock.json
            backend/package-lock.json
      - run: npm ci
      - run: npm ci --prefix backend
      - run: npm run build
      - run: npm run check:bundle

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: |
            package-lock.json
            backend/package-lock.json
      - run: npm ci
      - run: npm ci --prefix backend
      - run: npx playwright install --with-deps chromium webkit
      - run: npm run test:e2e
      # Fixtures are synthetic, so traces are safe to keep. Only on failure.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: playwright-traces
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7

  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      # Shipped dependencies must have no known high/critical advisories.
      - run: npm audit --omit=dev --audit-level=high
      - run: npm audit --omit=dev --audit-level=high --prefix backend

  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build and start the stack (images are not pushed)
        run: |
          SSB_SYNC_TOKEN="$(openssl rand -hex 32)"
          export SSB_SYNC_TOKEN
          docker compose up --build --detach --wait --wait-timeout 180
      - name: Smoke test
        run: |
          curl --fail --silent --show-error http://127.0.0.1:3176/ > /dev/null
          docker compose exec -T api wget -q -O - http://127.0.0.1:3177/healthz
          # Without the token the API must refuse.
          status="$(curl --silent --output /dev/null --write-out '%{http_code}' http://127.0.0.1:3176/api/data)"
          echo "unauthenticated /api/data -> $status"
          test "$status" = 401
      - name: Logs on failure
        if: failure()
        run: docker compose logs --no-color
      - name: Stop
        if: always()
        run: docker compose down --volumes

  ci-ok:
    # The single required status check for branch protection.
    if: always()
    needs: [lint, unit, contract, build, e2e, audit, docker]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: All jobs passed
        run: |
          echo '${{ toJSON(needs) }}' | jq -e 'to_entries | all(.value.result == "success")'
