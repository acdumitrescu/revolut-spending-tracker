[package]
name = "simplesafebanking-desktop"
version = "0.1.0"
description = "SimpleSafeBanking desktop shell: hosts the web UI and runs the backend sidecar"
edition = "2021"
publish = false
license-file = "../LICENSE"

[lib]
name = "ssb_desktop"
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "=2.7.3", features = [] }

[dependencies]
tauri = { version = "=2.12.4", features = [] }
tauri-plugin-single-instance = "=2.5.4"
tauri-plugin-opener = "=2.7.2"
getrandom = "0.3"
libc = "0.2"
serde_json = "1"

[dev-dependencies]
tempfile = "3"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
